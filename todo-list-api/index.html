<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C# Todo Pro | Modern Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .task-card {
            transition: all 0.2s ease-in-out;
        }

            .task-card:hover {
                transform: translateY(-2px);
            }

        .completed-task {
            opacity: 0.5;
            background-color: #f3f4f6;
        }

            .completed-task h3 {
                text-decoration: line-through;
            }

        .hidden {
            display: none;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- Auth Container -->
    <div id="auth-section" class="flex items-center justify-center min-h-screen px-4">
        <div class="max-w-md w-full bg-white p-10 rounded-3xl shadow-2xl border border-slate-100">

            <!-- ՄՈՒՏՔԻ ԲԱԺԻՆ (LOGIN) -->
            <div id="login-form">
                <div class="text-center mb-8">
                    <h2 class="text-3xl font-bold text-slate-800">Մուտք</h2>
                    <p class="text-slate-500 mt-2">Բարի վերադարձ</p>
                </div>
                <div class="space-y-4">
                    <input type="text" id="username" placeholder="Օգտանուն" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="password" id="password" placeholder="Գաղտնաբառ" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500">
                    <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl transition shadow-lg">Մուտք Գործել</button>
                    <p class="text-center text-sm text-slate-500">
                        Չունե՞ք հաշիվ: <button onclick="toggleAuthMode()" class="text-blue-600 font-bold hover:underline">Գրանցվել</button>
                    </p>
                </div>
            </div>

            <!-- ԳՐԱՆՑՄԱՆ ԲԱԺԻՆ (REGISTER) - Սկզբում թաքնված է -->
            <div id="register-form" class="hidden">
                <div class="text-center mb-8">
                    <h2 class="text-3xl font-bold text-slate-800">Գրանցում</h2>
                    <p class="text-slate-500 mt-2">Ստեղծեք նոր հաշիվ</p>
                </div>
                <div class="space-y-4">
                    <input type="text" id="reg-username" placeholder="Ընտրեք օգտանուն" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-green-500">
                    <input type="password" id="reg-password" placeholder="Ստեղծեք գաղտնաբառ" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-green-500">
                    <input type="email" id="reg-email" placeholder="Էլ․հասցե" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-green-500">
                    <button onclick="handleRegister()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-2xl transition shadow-lg">Գրանցվել</button>
                    <p class="text-center text-sm text-slate-500">
                        Արդեն ունե՞ք հաշիվ: <button onclick="toggleAuthMode()" class="text-blue-600 font-bold hover:underline">Մուտք գործել</button>
                    </p>
                </div>
            </div>

        </div>
    </div>

    <!-- Main App Container -->
    <div id="app-section" class="max-w-4xl mx-auto py-12 px-6 hidden">
        <header class="flex justify-between items-center mb-12">
            <div>
                <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">Իմ Գործերը</h1>
                <p class="text-slate-500 mt-1">Ողջույն, <span id="display-user" class="font-semibold text-blue-600 underline decoration-blue-200 underline-offset-4"></span></p>
            </div>
            <button onclick="handleLogout()" class="group flex items-center gap-2 bg-white border border-slate-200 hover:bg-red-50 hover:border-red-100 text-slate-600 hover:text-red-600 px-5 py-2.5 rounded-xl font-medium transition-all">
                <span>Ելք</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            </button>
        </header>

        <div id="admin-controls" class="hidden mt-8 p-6 bg-purple-50 rounded-3xl border border-purple-200">
            <h2 class="text-2xl font-bold text-purple-800 mb-4">Admin Dashboard</h2>
            <div class="flex gap-4 mb-6">
                <button onclick="loadAllUsers()" class="bg-purple-600 text-white px-4 py-2 rounded-xl hover:bg-purple-700 transition">Տեսնել բոլոր օգտատերերին</button>
                <button onclick="loadAllTasksAdmin()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl hover:bg-indigo-700 transition">Տեսնել բոլոր առաջադրանքները</button>

                <div class="relative flex-1">
                    <input type="text" id="admin-search-input" oninput="handleAdminSearch()"
                           placeholder="Որոնել բոլորի թասքերում..."
                           class="w-full px-4 py-2 pl-10 bg-white border border-purple-200 rounded-xl outline-none">
                    <span class="absolute left-3 top-2.5">🔍</span>
                </div>
            </div>
            <div id="admin-display-area" class="space-y-4">
                <!-- Այստեղ կհայտնվեն կամ օգտատերերը, կամ բոլորի task-երը -->
            </div>
        </div>

        <!-- Input Section -->
        <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200 mb-10">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <input type="text" id="task-title" placeholder="Ի՞նչ պետք է անել..." class="p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:bg-white focus:ring-2 focus:ring-blue-500 transition">
                <input type="text" id="task-desc" placeholder="Լրացուցիչ նկարագրություն" class="p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:bg-white focus:ring-2 focus:ring-blue-500 transition">
                <input type="date" id="task-duedate" placeholder="" class="p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:bg-white focus:ring-2 focus:ring-blue-500 transition text-slate-500">
            </div>
            <button onclick="addTask()" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-4 rounded-2xl transition shadow-xl flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"></path></svg>
                Ավելացնել Առաջադրանք
            </button>
        </div>


        <!-- Search Section -->
        <div class="mb-6 relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
            <input type="text" id="search-input" oninput="handleSearch()"
                   placeholder="Որոնել իմ թասքերը ըստ վերնագրի..."
                   class="w-full p-4 pl-12 bg-white border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 shadow-sm transition">
        </div>

        <!-- Task List Container -->
        <div id="task-list" class="grid gap-4">
            <!-- Dynamic tasks go here -->
        </div>

    </div>

    <script>
        // --- CONFIGURATION ---
        const API_BASE_URL = 'https://localhost:7059/api';
        let currentUser = { id: 1, name: '', isAdmin: false };

        // 1. Փոխել Մուտք/Գրանցում դաշտերը
        function toggleAuthMode() {
            document.getElementById('login-form').classList.toggle('hidden');
            document.getElementById('register-form').classList.toggle('hidden');
        }

        // 2. Գրանցման հարցումը
        async function handleRegister() {
            const user = document.getElementById('reg-username').value;
            const pass = document.getElementById('reg-password').value;
            const email = document.getElementById('reg-email').value;

            if (!user || !pass || !email) {
                alert("Խնդրում ենք լրացնել բոլոր դաշտերը:");
                return;
            }

            const userData = {
                username: user,
                password: pass,
                email: email,
                isAdmin: false // Միշտ սահմանում ենք որպես հասարակ օգտատեր
            };

            try {
                const response = await fetch(`${API_BASE_URL}/User/userRegistration`, { // Համոզվեք, որ այս endpoint-ը կա
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });

                if (response.ok) {
                    alert("Շնորհավորում ենք, գրանցումը հաջողվեց: Այժմ կարող եք մուտք գործել:");
                    toggleAuthMode(); // Վերադառնում ենք Login էջին
                } else {
                    const err = await response.text();
                    alert("Գրանցման սխալ: " + err);
                }
            } catch (err) {
                console.error("Register error:", err);
            }
        }

        async function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (!user || !pass) {
                alert("Խնդրում ենք լրացնել բոլոր դաշտերը");
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/User/userLogin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                // Եթե սերվերը վերադարձրել է սխալ ստատուս (օրինակ՝ 400 BadRequest կամ 401 Unauthorized)
                if (!response.ok) {
                    alert("Մուտքը մերժված է. սխալ տվյալներ");
                    return;
                }

                // Ստանում ենք սերվերի ուղարկած JSON-ը ({ token: "eyJhbG..." })
                const data = await response.json();
                console.log("Server response:", data);

                if (data && data.token) {
                    // 1. Պահպանում ենք թոքենը բրաուզերի հիշողությունում (localStorage)
                    localStorage.setItem('jwtToken', data.token);

                    // 2. Դեկոդավորում ենք JWT թոքենի payload-ը՝ տվյալները կարդալու համար
                    try {
                        const tokenParts = data.token.split('.');
                        const payloadBase64 = tokenParts[1];

                        // window.atob-ով բացում ենք Base64 տեքստը (ներառյալ հատուկ սիմվոլների ուղղումը)
                        const decodedPayload = window.atob(payloadBase64.replace(/-/g, '+').replace(/_/g, '/'));
                        const tokenPayload = JSON.parse(decodedPayload);
                        console.log("Decoded Token Payload:", tokenPayload);

                        // .NET-ի ClaimTypes-ները կարող են լինել երկար URL-ներով կամ կարճ անուններով՝ կախված սերվերի նախագծումից
                        const userId = tokenPayload["http://schemas.xmlsoap.org/ws/2005/05/identity/claims/nameidentifier"] || tokenPayload.nameid || tokenPayload.sub;
                        const userName = tokenPayload["http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name"] || tokenPayload.unique_name;
                        const userRole = tokenPayload["http://schemas.microsoft.com/ws/2008/06/identity/claims/role"] || tokenPayload.role;

                        // 3. Պահում ենք ստացված 1003-ը լոկալ սթորիջում
                        if (userId) {
                            localStorage.setItem('userId', userId);
                            console.log("UserId-ն հաջողությամբ պահվեց localStorage-ում:", userId);
                        }

                        // 4. Լրացնում ենք currentUser-ը սերվերի տված իրական տվյալներով
                        currentUser.id = userId;
                        currentUser.name = userName || "Օգտատեր";
                        currentUser.isAdmin = (userRole === 'Admin');

                    } catch (decodeError) {
                        console.error("Թոքենից տվյալները հանելու սխալ:", decodeError);
                        alert("Մուտքի սխալ՝ թոքենի վավերացման խնդիր:");
                        return;
                    }

                    // 5. UI-ի փոփոխություն (Թաղցնում ենք լոգինի էջը, բացում ենք հավելվածը)
                    document.getElementById('auth-section').classList.add('hidden');
                    document.getElementById('app-section').classList.remove('hidden');
                    document.getElementById('display-user').innerText = currentUser.name;

                    // 6. Ադմինի դաշտերի ցուցադրում և գործերի բեռնում
                    const adminControls = document.getElementById('admin-controls');
                    if (currentUser.isAdmin) {
                        if (adminControls) adminControls.classList.remove('hidden');
                        loadAllTasksAdmin(); // Բեռնում ենք բոլոր օգտատերերի գործերը
                    } else {
                        if (adminControls) adminControls.classList.add('hidden');
                        loadTasks(); // Բեռնում ենք միայն տվյալ օգտատիրոջ գործերը
                    }
                } else {
                    alert("Մուտքը մերժված է. թոքենը չի գտնվել սերվերի պատասխանի մեջ");
                }
            } catch (err) {
                console.error("Մանրամասն սխալը:", err);
                alert("Սերվերի հետ կապի սխալ: " + err.message);
            }
        }

        function handleLogout() {
            // 1. Ջնջում ենք թոքենը և օգտատիրոջ տվյալները լոկալ սթորիջից
            localStorage.removeItem('jwtToken');
            localStorage.removeItem('currentUser'); // Եթե պահում ես օգտատիրոջ տվյալները

            // 2. Մաքրում ենք ընթացիկ փոփոխականները հիշողությունից
            currentUser = null;

            console.log("Օգտատերը դուրս եկավ համակարգից:");

            // 3. Թարմացնում ենք էջը կամ UI-ն, որպեսզի բացվի Login-ի պատուհանը
            // Տարբերակ Ա: Պարզապես թարմացնել էջը (ամենահեշտ և մաքուր տարբերակը)
            window.location.reload();

            // Տարբերակ Բ: Եթե ունես հատուկ ֆունկցիա UI-ն փոխելու համար (օրինակ՝ showLoginAndHideDashboard)
            // checkAuthStatus(); 
        }

        async function handleSearch() {
            const searchText = document.getElementById('search-input').value;
            const taskListContainer = document.getElementById('task-list');

            if (!searchText.trim()) {
                loadTasks();
                return;
            }

            const token = localStorage.getItem('jwtToken'); // 🔴 Վերցնում ենք թոքենը

            try {
                const response = await fetch(`${API_BASE_URL}/TaskItem/searchTaskByContainingTitle`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` // 🔴 ԱՎԵԼԱՑՎԱԾ Է
                    },
                    body: JSON.stringify(searchText)
                });

                if (response.ok) {
                    const data = await response.json();
                    // Ֆիլտրում ենք, որ օգտատերը տեսնի միայն իրենը
                    const myTasks = data.filter(t => t.userId === Number(currentUser.id));

                    if (myTasks.length === 0) {
                        taskListContainer.innerHTML = `<p class="text-center py-10 text-slate-500">Արդյունք չկա:</p>`;
                    } else {
                        renderTasks(myTasks, 'task-list');
                    }
                } else if (response.status === 401) {
                    alert("Ձեր սեսիան ավարտվել է, խնդրում ենք նորից մուտք գործել:");
                }
            } catch (err) { console.error(err); }
        }

        async function handleAdminSearch() {
            const searchText = document.getElementById('admin-search-input').value;
            const adminArea = document.getElementById('admin-display-area');

            if (!searchText.trim()) {
                loadAllTasksAdmin();
                return;
            }

            const token = localStorage.getItem('jwtToken'); // 🔴 Վերցնում ենք թոքենը

            try {
                const response = await fetch(`${API_BASE_URL}/TaskItem/searchTaskByContainingTitle`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` // 🔴 ԱՎԵԼԱՑՎԱԾ Է
                    },
                    body: JSON.stringify(searchText)
                });

                if (response.ok) {
                    const allFoundTasks = await response.json();

                    if (allFoundTasks.length === 0) {
                        adminArea.innerHTML = `<p class="text-center py-10 text-purple-500">Բազայում ոչինչ չգտնվեց:</p>`;
                    } else {
                        renderTasks(allFoundTasks, 'admin-display-area');
                    }
                } else if (response.status === 401) {
                    alert("Ձեր սեսիան ավարտվել է, խնդրում ենք նորից մուտք գործել:");
                }
            } catch (err) { console.error(err); }
        }

        async function addTask() { // Պարամետրերը հանեցինք, արժեքները կվերցնենք ներսում
            // 1. Վերցնում ենք տեքստերը input-ներից (ստուգիր, որ ID-ները ճիշտ լինեն)
            const titleInput = document.getElementById('task-title');
            const descInput = document.getElementById('task-desc');
            const dueDateInput = document.getElementById('task-duedate');

            // Ստուգում ենք՝ արդյոք այս element-ները գոյություն ունեն էջում
            if (!titleInput || !dueDateInput) {
                console.error("HTML-ում input-ների ID-ները սխալ են դրված:");
                return;
            }

            const title = titleInput.value.trim();
            const description = descInput ? descInput.value.trim() : "";
            const dueDate = dueDateInput.value;

            // 2. Ֆրոնտենդ ստուգում՝ դատարկ չուղարկելու համար
            if (!title || !dueDate) {
                alert("Վերնագիրը և Վերջնաժամկետը պարտադիր են։");
                return;
            }

            const token = localStorage.getItem('jwtToken');
            if (!token) {
                alert("Խնդրում ենք նախ մուտք գործել համակարգ:");
                return;
            }

            // 3. Ստեղծում ենք օբյեկտը (անունները պետք է համընկնեն C# DTO-ի հետ)
            const taskData = {
                title: title,
                description: description,
                dueDate: dueDate
            };

            try {
                const userId = localStorage.getItem('userId'); // Վերցնում ենք 1003-ը

                const response = await fetch(`${API_BASE_URL}/TaskItem/createTask?userId=${userId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(taskData)
                });

                if (response.ok) {
                    alert("Թասքը հաջողությամբ ստեղծվեց:");

                    // Մաքրում ենք դաշտերը
                    titleInput.value = '';
                    if (descInput) descInput.value = '';
                    dueDateInput.value = '';

                    loadTasks();
                } else {
                    const errorResult = await response.json();
                    console.error("Սերվերի վալիդացիայի սխալ:", errorResult);
                    alert("Չհաջողվեց ստեղծել թասքը: Ստուգեք տվյալները:");
                }
            } catch (error) {
                console.error("Ցանցային սխալ:", error);
            }
        }

        // Ֆունկցիային ID-ից բացի փոխանցում ենք նաև ընթացիկ վերնագիրն ու նկարագրությունը
        // 1. Ավելացնում ենք dueDate պարամետրը ֆունկցիայի մեջ
        // Ավելացրեցինք taskUserId պարամետրը
        async function toggleTask(taskId, isDone, title, description, dueDate, taskUserId) {
            const token = localStorage.getItem('jwtToken'); // Ուղղված բանալին
            if (!token) return;

            try {
                const response = await fetch(`${API_BASE_URL}/TaskItem/updateTask?id=${taskId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        id: taskId,
                        title: title,
                        description: description,
                        dueDate: dueDate,
                        isDone: !isDone, // Շրջում ենք կարգավիճակը (true -> false կամ false -> true)
                        userId: taskUserId // Ուղարկում ենք օգտատիրոջ ID-ն, որպեսզի բեքենդը վալիդացիան անցկացնի
                    })
                });

                if (response.ok) {
                    console.log("Հաջողությամբ թարմացվեց");
                    // Ստուգում ենք՝ ով է թարմացրել, որպեսզի ճիշտ ցուցակը վերաբեռնենք
                    currentUser.isAdmin ? loadAllTasksAdmin() : loadTasks();
                } else {
                    alert("Չհաջողվեց թարմացնել կարգավիճակը:");
                }
            } catch (error) {
                console.error(error);
            }
        }

        // 2. Առաջադրանքի ջնջում
        async function deleteTask(taskId) {
            // Հաստատման պատուհան, որպեսզի օգտատերը պատահական չջնջի
            if (!confirm("Վստա՞հ եք, որ ցանկանում եք ջնջել այս առաջադրանքը:")) {
                return;
            }

            // Վերցնում ենք ճիշտ բանալիով թոքենը (ինչպես նախորդ քայլում ուղղեցինք)
            const token = localStorage.getItem('jwtToken');
            if (!token) {
                alert("Նախ մուտք գործեք համակարգ:");
                return;
            }

            try {
                // Ուղարկում ենք DELETE հարցում՝ id-ն փոխանցելով որպես Query String (?id=...)
                const response = await fetch(`${API_BASE_URL}/TaskItem/deleteTask?id=${taskId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}` // Ապահովում ենք վավերացումը
                    }
                });

                if (response.ok) {
                    console.log("Առաջադրանքը հաջողությամբ ջնջվեց");

                    // Թարմացնում ենք էկրանի ցուցակը՝ կախված օգտատիրոջ դերից
                    if (currentUser && currentUser.isAdmin) {
                        loadAllTasksAdmin();
                    } else {
                        loadTasks();
                    }
                } else {
                    // Եթե բեքենդը սխալ վերադարձնի (օրինակ՝ task-ը չգտնվի)
                    alert("Չհաջողվեց ջնջել առաջադրանքը։");
                }
            } catch (error) {
                console.error("Ջնջման սխալ:", error);
                alert("Տեղի է ունեցել սխալ սերվերի հետ կապվելիս։");
            }
        }


        function resetUI() {
            // 1. Մաքրում ենք օգտատիրոջ տվյալները memory-ից
            currentUser = { id: 0, name: '', isAdmin: false };

            // 2. Թաքցնում ենք հավելվածի բաժինները
            document.getElementById('app-section').classList.add('hidden');
            document.getElementById('admin-controls').classList.add('hidden'); // Եթե ադմին էր

            // 3. Ցուցադրում ենք Login բաժինը
            document.getElementById('auth-section').classList.remove('hidden');

            // 4. Մաքրում ենք input դաշտերը
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';

            // 5. Մաքրում ենք task-երի ցուցակը, որ հաջորդ օգտատերը հին տվյալները չտեսնի
            document.getElementById('task-list').innerHTML = '';
            if (document.getElementById('admin-display-area')) {
                document.getElementById('admin-display-area').innerHTML = '';
            }

            document.getElementById('search-input').value = '';
            if (document.getElementById('admin-search-input')) {
                document.getElementById('admin-search-input').value = '';
            }
        }

        // Ֆունկցիան, որը բերում է միայն տվյալ օգտատիրոջ task-երը
        async function loadTasks() {
            const token = localStorage.getItem('jwtToken');

            try {
                // ՃԻՇՏ ՀԱՍՑԵՆ: api/TaskItem/getAllTasksOfUser
                const response = await fetch(`${API_BASE_URL}/TaskItem/getAllTasksOfUser`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    console.error(`Սերվերի սխալ ստատուս: ${response.status}`);
                    alert(`Չհաջողվեց բեռնել գործերը: Սերվերը վերադարձրեց ${response.status}`);
                    return;
                }

                const data = await response.json();
                console.log("Tasks loaded:", data);

                // Կոմենտի փոխարեն կանչում ենք ֆունկցիան՝ փոխանցելով տվյալները
                renderTasks(data, 'task-list');
                // Այստեղ քո հին UI-ի կոդն է (օրինակ՝ renderTasks(data))

            } catch (err) {
                console.error("Error loading user tasks:", err);
            }
        }

        // --- ADMIN FUNCTIONS ---

        // 1. Տեսնել բոլոր օգտատերերին
        async function loadAllUsers() {
            const response = await fetch(`${API_BASE_URL}/User/getAllUsers`);
            const users = await response.json();

            const display = document.getElementById('admin-display-area');
            display.innerHTML = '<h3 class="font-bold">Բոլոր Օգտատերերը:</h3>';

            users.forEach(u => {
                display.innerHTML += `
                    <div class="p-3 bg-white border rounded-xl flex justify-between">
                        <span>Username: <b>${u.username}</b>     User ID: <b>${u.id}</b> </span>
                    </div>`;
            });
        }

        // 2. Տեսնել բոլորի առաջադրանքները (Admin)
        async function loadAllTasksAdmin() {
            const token = localStorage.getItem('jwtToken');

            try {
                const response = await fetch(`${API_BASE_URL}/TaskItem/getAllTasksOfAllUsers`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    console.error(`Սերվերի սխալ ստատուս: ${response.status}`);
                    alert(`Չհաջողվեց բեռնել ադմինի գործերը։ Սերվերի ստատուսը՝ ${response.status}`);
                    return;
                }

                const data = await response.json();
                console.log("All admin tasks loaded:", data);

                // Կանչում ենք renderTasks-ը ադմինի display area-ի համար
                renderTasks(data, 'admin-display-area');

                // Այստեղ քո հին UI-ի կոդն է ադմինի աղյուսակը լրացնելու համար

            } catch (err) {
                console.error("Error loading admin tasks:", err);
                alert("Ադմինի գործերը բեռնելու սխալ։");
            }
        }

        // 3. Տեսնել կոնկրետ օգտատիրոջ առաջադրանքները (ըստ ID)
        async function viewUserTasks(userId) {
            const response = await fetch(`${API_BASE_URL}/TaskItem/getAllTasksOfUser?userId=${userId}`);
            const tasks = await response.json();
            renderTasks(tasks, 'admin-display-area');
        }

        async function editTask(id, oldTitle, oldDesc, oldDate, currentIsDone, taskUserId) {
            const newTitle = prompt("Վերնագիր:", oldTitle);
            if (newTitle === null) return;

            const newDesc = prompt("Նկարագրություն:", oldDesc);
            if (newDesc === null) return;

            const newDate = prompt("Վերջնաժամկետ (YYYY-MM-DD):", oldDate ? oldDate.split('T')[0] : "");
            if (newDate === null) return;

            const token = localStorage.getItem('jwtToken'); // Վերցնում ենք թոքենը
            if (!token) {
                alert("Նախ մուտք գործեք համակարգ:");
                return;
            }

            const taskData = {
                id: id,
                title: newTitle,
                description: newDesc,
                dueDate: newDate,
                isDone: currentIsDone,
                userId: taskUserId
            };

            try {
                const response = await fetch(`${API_BASE_URL}/TaskItem/updateTask?id=${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` // ԱՎԵԼԱՑՎԱԾ Է․ Առանց սրա 401 Unauthorized կլիներ
                    },
                    body: JSON.stringify(taskData)
                });

                if (response.ok) {
                    currentUser.isAdmin ? loadAllTasksAdmin() : loadTasks();
                } else {
                    alert("Չհաջողվեց խմբագրել առաջադրանքը:");
                }
            } catch (err) {
                console.error("Update error:", err);
            }
        }

        function renderTasks(tasks, containerId = 'task-list') {
            const list = document.getElementById(containerId);
            list.innerHTML = '';

            tasks.forEach(task => {
                const dateDisplay = task.dueDate ? new Date(task.dueDate).toLocaleDateString('hy-AM') : 'Ժամկետ չկա';
                const isCompleted = task.isDone;

                // Տվյալների նախապատրաստում (որպեսզի չակերտների հետ խնդիր չլինի)
                const desc = (task.description || '').replace(/'/g, "\\'");
                const title = (task.title || '').replace(/'/g, "\\'");
                const date = task.dueDate || '';
                const tUserId = task.userId; // Պահում ենք UserId-ն

                // --- ԱԴՄԻՆԻ BADGE ---
                const adminBadge = currentUser.isAdmin
                    ? `<span class="px-2 py-0.5 bg-purple-100 text-purple-600 text-[10px] rounded-full border border-purple-200 font-semibold">
                User ID: ${tUserId == 1 ? 'admin' : tUserId}
               </span>`
                    : '';

                const card = document.createElement('div');
                card.className = `task-card bg-white p-5 mb-3 rounded-2xl shadow-sm border-l-4 ${isCompleted ? 'border-green-400 opacity-60' : 'border-blue-500'} flex justify-between items-center`;

                card.innerHTML = `
            <div class="flex-1">
                <div class="flex items-center gap-3 mb-1">
                    <h4 class="font-bold ${isCompleted ? 'line-through text-slate-400' : 'text-slate-800'}">${task.title}</h4>
                    ${adminBadge} 
                </div>
                <p class="text-sm text-slate-500">${task.description || ''}</p>
                <div class="text-xs text-blue-500 mt-2 font-medium">📅 ${dateDisplay}</div>
            </div>
            <div class="flex gap-2 ml-4">
                <!-- ✔ Կարգավիճակի փոփոխություն -->
                <button onclick="toggleTask(${task.id}, ${isCompleted}, '${title}', '${desc}', '${date}', ${tUserId})" 
                        class="p-2.5 bg-slate-50 hover:bg-green-100 text-green-600 rounded-xl transition-all">
                    ${isCompleted ? '🔙' : '✔'}
                </button>
                
                <!-- 🔄 Խմբագրում -->
                <button onclick="editTask(${task.id}, '${title}', '${desc}', '${date}', ${isCompleted}, ${tUserId})" 
                        class="p-2.5 bg-slate-50 hover:bg-blue-100 text-blue-500 rounded-xl transition-all">
                    🔄
                </button>

                <!-- 🗑️ Ջնջում -->
                <button onclick="deleteTask(${task.id})" 
                        class="p-2.5 bg-slate-50 hover:bg-red-100 text-red-500 rounded-xl transition-all">
                    🗑️
                </button>
            </div>
        `;
                list.appendChild(card);
            });
        }
    </script>
</body>
</html>
